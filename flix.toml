[package]
name        = "flixlint"
description = "Flix のアーキテクチャ規則を、grep でなくコンパイラの AST から取った facts で check する linter"
version     = "0.1.0"
flix        = "0.76.0"
authors     = ["abab <ababup1192@gmail.com>"]

# WhyNot: [dependencies] に書いて配る形（sqlfx / logfx と同じ形）にしない。
# 1) `flix build-pkg` が .fpkg に入れるのは flix.toml / README.md / LICENSE.md / src/**/*.flix だけで、
#    bin/flixlint も shim の jar も入らない（jar を src/ に置いても落ちる。実測済み）。
# 2) rules/Flixlint*.flix は生成物の `Names` モジュールを参照するので、単体ではコンパイルできない。
#    利用側の [dependencies] に置くと、利用側の `flix check` が毎回 Undefined use 'Names.Fn' で落ちる。
# flixlint はライブラリではなく道具なので、リポジトリごと（clone / submodule / release の tarball）渡し、
# 利用側は bin/flixlint を呼ぶ。詳しくは README.md の「配り方と取り込み方」。
