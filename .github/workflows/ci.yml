name: ci

# WhyNot: push を全 branch で回さない。PR を開くと同じ commit で 2 回走る。
on:
  push:
    branches: [main]
  pull_request:

# WhyNot: devbox は使わない。CI が要るのは scala-cli と JDK の 2 つだけで、devbox は nix の store を
# 毎回作る分だけ遅い。手元の devbox.json と版が離れないよう、scala-cli は最新を取る。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WhyNot: setup-java を scala-cli-setup より後に置く。scala-cli-setup は自分の JDK 17 を
      # JAVA_HOME に入れるので、先に置くとコンパイラ（Flix 0.76 は 21 が要る）がその 17 で動く。
      - uses: VirtusLab/scala-cli-setup@v1.17.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the Flix version from flix.toml
        id: flix
        run: echo "version=$(sed -n 's/^flix *= *"\(.*\)"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"

      # WhyNot: flix.jar をキャッシュに入れる。release の asset は版ごとに不変で、毎回落とすと
      # ネットワークの気分で CI が赤くなる。
      - name: Cache flix.jar
        uses: actions/cache@v6
        with:
          path: flix.jar
          key: flix-${{ steps.flix.outputs.version }}

      - name: Download flix.jar
        run: |
          test -f flix.jar || curl -fsSL -o flix.jar \
            "https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar"

      # WhyNot: bin/flixlint に shim を組ませない。scala-cli は既定で bloop のサーバを起こし、
      # CI ではその起動が 30 秒で timeout する。ここで --server=false（scalac を直に呼ぶ）で組んでおけば、
      # bin/flixlint は既に在る jar を使う。
      - name: Build the shim
        run: |
          mkdir -p build
          scala-cli --power package shim --jar "$FLIX_JAR" --library -o build/flixlint-shim.jar -f --server=false
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar

      - name: make test
        run: make test
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar

      - name: make test-resolved
        run: make test-resolved
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar
