name: ci

# WhyNot: push を全 branch で回さない。PR を開くと同じ commit で 2 回走る。
on:
  push:
    branches: [main]
  pull_request:

# WhyNot: devbox は使わない。CI が要るのは scala-cli と JDK の 2 つだけで、devbox は nix の store を
# 毎回作る分だけ遅い。手元の devbox.json と版が離れないよう、scala-cli は最新を取る。
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # WhyNot: setup-java を scala-cli-setup より後に置く。scala-cli-setup は自分の JDK 17 を
      # JAVA_HOME に入れるので、先に置くとコンパイラ（Flix 0.78 は 21 が要る）がその 17 で動く。
      - uses: VirtusLab/scala-cli-setup@v1.17.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Read the Flix version from flix.toml
        id: flix
        run: echo "version=$(sed -n 's/^flix *= *"\(.*\)"/\1/p' flix.toml)" >> "$GITHUB_OUTPUT"

      # WhyNot: flix.jar をキャッシュに入れる。release の asset は版ごとに不変で、毎回落とすと
      # ネットワークの気分で CI が赤くなる。
      - name: Cache flix.jar
        uses: actions/cache@v6
        with:
          path: flix.jar
          key: flix-${{ steps.flix.outputs.version }}

      - name: Download flix.jar
        run: |
          test -f flix.jar || curl -fsSL -o flix.jar \
            "https://github.com/flix/flix/releases/download/v${{ steps.flix.outputs.version }}/flix.jar"

      # WhyNot: bin/flixlint に shim を組ませない。scala-cli は既定で bloop のサーバを起こし、
      # CI ではその起動が 30 秒で timeout する。ここで --server=false（scalac を直に呼ぶ）で組んでおけば、
      # bin/flixlint は既に在る jar を使う。
      - name: Build the shim
        run: |
          mkdir -p build
          scala-cli --power package shim --jar "$FLIX_JAR" --library -o build/flixlint-shim.jar -f --server=false
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar

      - name: make test
        run: make test
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar

      - name: make test-resolved
        run: make test-resolved
        env:
          FLIX_JAR: ${{ github.workspace }}/flix.jar

  # 利用側（flix_game_engine）は Windows でも Git Bash から bin/flixlint を起こす。shasum と java -cp の区切りの
  # ような Unix 決め打ちは Linux の job では見えないので、fixture と examples の 2 つだけ Windows で同じ報告になるかを見る。
  # WhyNot: test/run.sh を全部は流さない。常駐の server（Unix socket）と mktemp に頼る節があり、利用側が Windows で使うのは
  # 素の 1 回の lint だけ。
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # WhyNot: autocrlf を切ってから checkout する。既定の true だと test/expected*.txt が CRLF になり、LF で出る報告と食い違う。
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v7

      - uses: VirtusLab/scala-cli-setup@v1.17.1

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Download flix.jar
        run: |
          v=$(sed -n 's/^flix *= *"\(.*\)"/\1/p' flix.toml)
          curl -fsSL -o flix.jar "https://github.com/flix/flix/releases/download/v$v/flix.jar"

      - name: Build the shim
        run: |
          mkdir -p build
          scala-cli --power package shim --jar flix.jar --library -o build/flixlint-shim.jar -f --server=false

      - name: fixture と examples を resolved で lint して、Linux と同じ報告か
        run: |
          set -u
          ws="$(cygpath -u "$GITHUB_WORKSPACE")"
          jar="$(cygpath -w "$PWD/flix.jar")"
          check() { # DIR RULES EXIT EXPECTED
            set +e
            (cd "$1" && "$ws/bin/flixlint" --flix-jar "$jar" --shim "$ws/build/flixlint-shim.jar" --rules "$2" --today 2026-09-19 \
              --stage resolved --build-dir "$ws/build/$(basename "$1")" src) > actual.txt
            code=$?
            set -e
            [ "$code" = "$3" ] || { echo "$1/$2: expected exit $3, got $code"; cat actual.txt; exit 1; }
            diff "test/$4" actual.txt
          }
          check examples rules.flix 1 expected-examples.txt
          check test/fixture rules/rules.flix 1 expected.txt
